__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
]

task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

remap_mscoco_category: True

output_dir: output/dfine_s_utdac2020
checkpoint_freq: 10
print_freq: 50
use_amp: True
use_ema: True

DFINE:
  backbone: HGNetv2

HGNetv2:
  pretrained: False
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  local_model_dir: weight/hgnetv2/

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 220
num_classes: 4

train_dataloader:
  type: DataLoader
  total_batch_size: 16
  dataset:
    type: CocoDetection
    img_folder: /home/user03/lbl/Dataset/UTDAC2020/train2017
    ann_file: /home/user03/lbl/Dataset/UTDAC2020/annotations/instances_train2017.json
    return_masks: False
    transforms:
      type: Compose
      policy:
        epoch: 200
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    stop_epoch: 200
    ema_restart_decay: 0.9999
    base_size_repeat: null

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  dataset:
    type: CocoDetection
    img_folder: /home/user03/lbl/Dataset/UTDAC2020/val2017
    ann_file: /home/user03/lbl/Dataset/UTDAC2020/annotations/instances_val2017.json
    return_masks: False
    transforms:
      type: Compose
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
